<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;

        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">Example A</div>
        <div class="item">Example B</div>
        <div class="item">Example C</div>
        <div class="item">Example D</div>
        <div class="item">Example E</div>
        <div class="item">Example F</div>
        <div class="item">Example G</div>
    </div>
</body>
</html>
