<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container{
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;

        }

        div#boxA{
            flex: 1 0 200px
        }

        div#boxB{
            flex: 1 1 150px;
        }

        div#boxC{
            flex: 1 8 auto;
        }
            
        

    </style>
</head>
<body>  
    <div class="container">
        <div class="item" id="boxA">A</div>
        <div class="item" id="boxB">B</div>
        <div class="item" id="boxC">C</div>

    </div>
</body>
</html>
